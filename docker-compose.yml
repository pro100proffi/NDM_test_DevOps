services:
  app:
    build: ./app
    container_name: xff_app
    networks:
      xff_net:
        ipv4_address: 172.28.0.20

  nginx1:
    image: nginx:1.27-alpine
    container_name: xff_nginx1
    volumes:
      - ./nginx/nginx1.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/xff.inc:/etc/nginx/xff.inc:ro
    ports:
      - "8081:80"
    depends_on:
      - app
      - nginx2
      - nginx3
    networks:
      xff_net:
        ipv4_address: 172.28.0.11

  nginx2:
    image: nginx:1.27-alpine
    container_name: xff_nginx2
    volumes:
      - ./nginx/nginx2.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/xff.inc:/etc/nginx/xff.inc:ro
    ports:
      - "8082:80"
    depends_on:
      - app
      - nginx3
    networks:
      xff_net:
        ipv4_address: 172.28.0.12

  nginx3:
    image: nginx:1.27-alpine
    container_name: xff_nginx3
    volumes:
      - ./nginx/nginx3.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/xff.inc:/etc/nginx/xff.inc:ro
    ports:
      - "8083:80"
    depends_on:
      - app
    networks:
      xff_net:
        ipv4_address: 172.28.0.13

networks:
  xff_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
