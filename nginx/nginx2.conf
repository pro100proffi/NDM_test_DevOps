include /etc/nginx/xff.inc;

server {
    listen 80;
    server_name nginx2;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $clean_x_forwarded_for;
        proxy_pass http://app:3000;
    }

    # пользователь -> nginx2 -> nginx3 -> приложение
    location /to-nginx3/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $clean_x_forwarded_for;
        proxy_pass http://nginx3/;
    }
}
